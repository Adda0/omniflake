    <style>
      /* The index table: name, description, stars, pinned date. */
      .flakes .head,
      .flakes .row {
        grid-template-columns: minmax(10rem, 16rem) minmax(0, 1fr) 4.5rem 6rem;
      }
      .flakes .row {
        border-bottom: 1px solid var(--line);
      }
      .flakes .num {
        text-align: right;
        font-variant-numeric: tabular-nums;
      }
      .flakes .name {
        font-family: ui-monospace, monospace;
        font-size: 13px;
      }
      .failures .head,
      .failures .row {
        grid-template-columns: minmax(10rem, 16rem) minmax(0, 1fr);
      }
      .failures .row {
        border-bottom: 1px solid var(--line);
        font-size: 13px;
      }
      .err {
        font-family: ui-monospace, monospace;
        color: var(--muted);
      }
      .controls {
        display: flex;
        gap: 0.6rem;
        align-items: center;
        margin: 0.6rem 0;
      }
      .controls select {
        font: inherit;
        background: var(--bg);
        color: var(--fg);
        border: 1px solid var(--line);
        border-radius: 4px;
        padding: 0.4rem;
      }
      .tag {
        font-size: 11px;
        border: 1px solid var(--line);
        border-radius: 3px;
        padding: 0 0.3rem;
        color: var(--muted);
        margin-left: 0.4rem;
        vertical-align: middle;
      }
    </style>
