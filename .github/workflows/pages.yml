# Publishes the index browser and the documentation to GitHub Pages. The
# deployed tree is `nix build .#site`, the same derivation `nix run .#serve`
# tests locally.
#
# One-time setup: repository Settings → Pages → Source: "GitHub Actions".
name: pages

on:
  push:
    branches: [main]
    paths:
      - site/**
      - docs/**
      - nix/**
      - tools/render-docs.py
      - tools/build-site-data.py
      - index.json
      - data-pins.json
      - failures.jsonl
      - .github/workflows/pages.yml
  # The daily index commit is pushed with the default token, which starts
  # no push-triggered workflow, so the site is rebuilt from here instead.
  workflow_run:
    workflows: [update index]
    types: [completed]
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Deploys must land in order; a newer push supersedes an in-flight one.
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    # A failed index run has nothing new to publish.
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - uses: cachix/install-nix-action@v31

      # Pushes what the job builds: the formatter, the tools, the docs and
      # site derivations. Pull requests from forks have no token and only
      # pull.
      - uses: cachix/cachix-action@v17
        with:
          name: omniflake
          authToken: "${{ secrets.CACHIX_AUTH_TOKEN }}"

      - name: Build the site
        # The store output is read-only and symlinked; the pages artifact
        # needs a plain writable directory, so dereference-copy it out.
        run: |
          nix build .#site
          cp -rL result _site
          chmod -R u+w _site

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - id: deployment
        uses: actions/deploy-pages@v4
