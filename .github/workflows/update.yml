# Keep the index current: discover new flakes on GitHub, re-resolve the
# flakes checked longest ago, pin whatever changed with Nix, and commit
# the result to main. Runs daily, and on demand. A revision is never
# fetched twice, so a routine run costs only what moved since yesterday.
#
# The commit is pushed with the default token, and GitHub does not start
# workflows from pushes made with it, so check.yml and pages.yml run on
# workflow_run instead of on push for these commits.
name: update index

on:
  schedule:
    - cron: "17 6 * * *"
  workflow_dispatch:
    inputs:
      refresh:
        description: "Re-pin every known flake to its current default branch"
        type: boolean
        default: false
      no-harvest:
        description: "Skip GitHub search; resolve, pin and regenerate only"
        type: boolean
        default: false
      refresh-oldest:
        description: "Re-resolve only this many stalest flakes (default 2000)"
        type: string
        default: ""
      # A smoke run: the full pipeline on a sliver of work, publishing
      # nothing. Pair with no-harvest and a small refresh-oldest.
      dry-run:
        description: "Run the pipeline but cut no release and push no commit"
        type: boolean
        default: false

permissions:
  contents: write

# A run can take longer than a day's gap only when a refresh is requested;
# never let two write to main at once.
concurrency:
  group: update-index
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 340
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}

      - uses: cachix/install-nix-action@v31

      # Pushes what the job builds: the formatter, the tools, the docs and
      # site derivations. Pull requests from forks have no token and only
      # pull.
      - uses: cachix/cachix-action@v17
        with:
          name: omniflake
          authToken: "${{ secrets.CACHIX_AUTH_TOKEN }}"

      - name: Update the index
        env:
          # GitHub search and GraphQL for harvest.py and resolve.py.
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PIN_JOBS: "8"
          # Empty on scheduled runs, so update.sh falls back to its default.
          REFRESH_OLDEST: ${{ inputs.refresh-oldest }}
        run: |
          args=()
          if [ "${{ inputs.refresh }}" = "true" ]; then args+=(--refresh); fi
          if [ "${{ inputs.no-harvest }}" = "true" ]; then args+=(--no-harvest); fi
          nix run .#update -- "${args[@]}"

      # The databases are not committed. Upload whatever moved to a dated
      # release and repoint data-pins.json, which the commit below carries.
      # Uploading before committing is deliberate: a commit that then fails
      # leaves unreferenced assets on a dated tag, which the next run simply
      # re-cuts, while the reverse order would commit a pin naming bytes
      # that were never uploaded.
      - name: Cut the data release
        if: ${{ !inputs.dry-run }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: nix run .#cut-data-release

      - name: Summarize
        run: |
          {
            echo "## Index"
            sed -n '/BEGIN index-status/,/END index-status/p' README.md | grep '^-'
            echo
            echo "## New failures"
            git diff --no-color -U0 -- failures.jsonl | grep '^+{' | cut -c1-200 | head -50 || true
            echo
            echo "## Changed files"
            git diff --stat | tail -15
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Commit
        if: ${{ !inputs.dry-run }}
        run: |
          git add failures.jsonl index.json locks README.md data-pins.json history.jsonl
          if git diff --cached --quiet; then
            echo "nothing changed"
            exit 0
          fi
          git -c user.name="omniflake" -c user.email="noreply@github.com" commit -q -F - <<EOF
          Update index

          $(sed -n '/BEGIN index-status/,/END index-status/p' README.md | grep '^-')
          EOF
          git push
